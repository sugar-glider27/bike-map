<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikewatching</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="map.css" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <!-- Mapbox GL JS CSS -->
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
      rel="stylesheet"
    />
    <script src="map.js" type="module"></script>
  </head>
  <body>
    <header>
      <h1>🚴🏼‍♀️ Bikewatching</h1>
      <label id="time-filter">
        Filter by time
        <input id="time-slider" type=range min="-1" max="1440" value="-1">
        <span>
          <time id="selected-time"></time>
          <em id="any-time">(any time)</em>
        </span>
      </label>
    </header>
    <p>An interactive map of Boston and Cambridge bike lanes, BlueBike stations, and ride traffic.</p>
    <div id="map">
      <svg></svg>
    </div>
    <div class="legend">
      <div style="--departure-ratio: 1" class="legend-item">More departures</div>
      <div style="--departure-ratio: 0.5" class="legend-item">Balanced</div>
      <div style="--departure-ratio: 0" class="legend-item">More arrivals</div>
    </div>
  </body>
</html>
